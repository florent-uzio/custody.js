name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  beta-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enter prerelease mode if needed
        run: |
          if [ ! -f .changeset/pre.json ]; then
            npx changeset pre enter beta
          fi

      - name: Version beta release
        run: npx changeset version

      - name: Commit version bump
        run: |
          git add .
          git diff --cached --quiet || git commit -m "chore: version beta release"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish beta to npm
        run: npm run release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # The stable `release` job gets tags and GitHub releases for free from
      # changesets/action; this job publishes by hand, so it creates them here.
      - name: Tag and create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping."
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --prerelease \
            --title "v$VERSION" \
            --notes "Published to npm under the \`beta\` dist-tag from \`${{ github.ref_name }}\`. Install with \`npm i @florent-uzio/custody@$VERSION\`. See CHANGELOG.md for details."
